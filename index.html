<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600&display=swap" rel="stylesheet">
<title>Weinkarte · La Piazza Bistro</title>
<style>
:root{--bg:#ffffff;--bg2:#e6eef2;--ink:#004d69;--mute:#4d7183;--gold:#004d69;--line:rgba(0,77,105,.25);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:10px clamp(20px,4vw,56px);border-bottom:1px solid var(--line);flex:none;align-items:center;background:var(--bg);position:relative;z-index:2}
nav .logo{height:clamp(35px,5.2vw,51px);width:auto;margin-left:clamp(16px,3.5vw,48px);margin-right:auto;display:block}
nav button{background:none;border:1px solid transparent;color:var(--mute);font-family:inherit;font-weight:300;font-size:clamp(.8rem,1.7vw,1rem);padding:8px clamp(8px,1.5vw,18px);border-radius:10px;cursor:pointer;white-space:nowrap;min-height:44px}
nav button[aria-current="true"]{background:var(--ink);color:#fff}
main{flex:1;overflow-y:auto;overflow-x:hidden;display:grid;grid-template-columns:minmax(220px,44%) 1fr;grid-template-rows:minmax(0,1fr);gap:clamp(16px,4vw,56px);align-items:safe center;padding:clamp(10px,1.5vw,20px) clamp(20px,4vw,56px);min-height:0;touch-action:pan-y}
.art{display:flex;justify-content:center;align-items:center;height:100%;min-height:0;background:radial-gradient(ellipse at 50% 55%,var(--bg2),transparent 70%)}
.art img{height:100%;max-height:100%;max-width:100%;width:auto;object-fit:contain;mix-blend-mode:multiply}
.lg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;transition:opacity .25s,visibility .25s}
.lg.off{display:none}
.lg button{background:#fff;border:1px solid var(--line);color:var(--ink);font-family:inherit;font-weight:400;font-size:.9rem;letter-spacing:.06em;padding:6px 16px;min-height:40px;min-width:52px;border-radius:10px;cursor:pointer}
.lg button[aria-current="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.txt{max-width:640px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateX(var(--dx,24px))}to{opacity:1;transform:none}}
.cat{color:var(--mute);font-size:.95rem;font-weight:300;letter-spacing:.35em;text-transform:uppercase}
h1{font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:300;letter-spacing:-.01em;font-size:clamp(2rem,5vw,3.6rem);line-height:1.08;margin:8px 0 10px}
.prod{color:var(--mute);font-size:1.1rem}
.tags{margin:6px 0 18px;color:var(--gold);font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:400;font-size:1.2rem}
.desc{font-weight:300;font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:clamp(1.05rem,1.9vw,1.35rem);line-height:1.6;max-width:56ch}
.pair{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:1.1rem;line-height:1.5;color:var(--mute)}
.pair b{color:var(--ink);font-weight:600;margin-right:6px}
.price{display:flex;gap:36px;margin-top:22px;flex-wrap:wrap}
.price div{display:flex;flex-direction:column}
.price small{color:var(--gold);font-size:.95rem}
.price strong{font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:clamp(1.6rem,3vw,2.2rem);font-weight:300}
footer{flex:none;position:relative;z-index:2;background:#fff;border-top:1px solid var(--line);padding:10px clamp(12px,2vw,20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:var(--mute);font-size:.95rem;line-height:1.4}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:720px){main{grid-template-columns:1fr;grid-template-rows:auto 1fr;align-items:start}.art{height:36vh}}
@media (prefers-reduced-motion:reduce){.txt{animation:none}}
</style>
</head>

{c:"W",n:"Just Mamolata",p:"Marco Felluga · Friuli Bianco DOC",t:"Charaktervoll, gastronomisch",d:"Friaul: Ein Weißwein vom Weingut Marco Felluga, der mit Ausdruck und Frische überzeugt. Die Gestaltung mit geometrischen Farbflächen macht ihn auch optisch zum Blickfang auf dem Tisch.",m:"Meeresfrüchte, gegrilltes Gemüse, leichte Pasta",pr:[F("29,50 €")]},
{c:"W",n:"Pinot Grigio Mongris",p:"Marco Felluga · Collio DOC · Pinot Grigio",t:"Frisch, elegant",d:"Friaul: Ein Pinot Grigio aus dem Collio, der Eleganz mit Trinkfluss verbindet. Feine Birnen- und Zitrusnoten treffen auf eine saubere, lebendige Säure. Ein Klassiker aus dem Friaul, der sich vom ersten Glas an mühelos trinkt.",m:"Vorspeisen, Carpaccio, Risotto mit Gemüse, helles Fleisch",pr:[F("34,50 €")]},

{c:"R",n:"Roseri",p:"Ca' Maiol · Chiaretto · Valtènesi",t:"Fruchtig, sommerlich",d:"Lombardei, Gardasee: Ein Chiaretto aus dem Valtènesi, mit einladender Fruchtaromatik und frischer Säure. Die zarte Farbe bringt Sommerstimmung auf jeden Tisch und passt wunderbar als Aperitif.",m:"Antipasti, Burrata, Salate, Sommergerichte",pr:[["Glas 0,2 l","8,90 €"],F("28,50 €")]},

{c:"T",n:"Centurio Minor Primitivo",p:"Centurio · Primitivo",t:"Dicht, fruchtig",d:"Apulien: Ein Primitivo mit dichter dunkler Frucht, würziger Note und weichem Körper. Ein vielseitiger Rotwein für den geselligen Tisch.",m:"Pizza, Pasta mit Tomatensauce, kräftiges Fleisch",pr:[["Glas 0,2 l","6,90 €"],F("22,50 €")]},

{c:"T",n:"Ninfa",p:"Velenosi",t:"Lebendig, ausdrucksstark",d:"Marken: Ein Rotwein aus den Marken von Velenosi mit lebendiger Frucht und klarer Struktur. Die markante Etikettengestaltung macht ihn zum Gesprächsthema am Tisch.",m:"Pasta, Pizza, Fleischgerichte",pr:[F("31,50 €")]},
{c:"T",n:"Ziggurat Montefalco Rosso",p:"Tenute Lunelli · Montefalco Rosso DOC",t:"Kraftvoll, tiefgründig",d:"Umbrien: Ein Montefalco Rosso aus der Tenuta Castelbuono, mit dunkler Frucht, Struktur und Tiefe. Ein Wein für Liebhaber ausdrucksstarker italienischer Rotweine.",m:"Schmorbraten, Wildgerichte, würziges Fleisch",pr:[F("31,50 €")]},

{c:"T",n:"Bansella Nizza",p:"Prunotto · Barbera (Nizza DOCG)",t:"Saftig, lebendig",d:"Piemont: Der Bansella aus der Nizza-Zone zeigt die Barbera von ihrer eleganten Seite: lebendige Säure, dunkle Kirschfrucht und geschmeidige Tannine. Ein Wein, der Lust auf das nächste Glas macht.",m:"Pasta mit Tomatensauce, Geflügel, Salsiccia",pr:[F("36,50 €")]},

const TR={"pt": [["", "Finas bolhas e frescor, com um toque discreto de doçura no final. Um acompanhamento elegante para começar ou para a sobremesa.", "", "Sacchetto · Espumante · Extra Dry"], ["Mediterrâneo, vivo", "Calábria: um vinho branco da Calábria com fruta mediterrânea e acidez fresca. Representa a subestimada diversidade da cultura vinícola do sul da Itália.", "Peixe, saladas, massa com frutos do mar"], ["Mineral, cremoso", "Lombardia, Lago de Garda: o Lugana vem da margem sul do Lago de Garda e é um dos vinhos brancos mais empolgantes do norte da Itália. Notas delicadas de ervas e frutas de caroço, frescor mineral e uma maciez cremosa no paladar.", "Peixe, frutos do mar, risoto, nhoque na manteiga de sálvia"], ["Com caráter, gastronômico", "Friuli: um vinho branco da vinícola Marco Felluga, que convence pela expressão e pelo frescor. O rótulo com áreas de cor geométricas também o torna um destaque visual na mesa.", "Frutos do mar, legumes grelhados, massas leves"], ["Fresco, elegante", "Friuli: um Pinot Grigio do Collio que une elegância e facilidade de beber. Notas finas de pera e cítricos encontram uma acidez limpa e viva. Um clássico do Friuli que se bebe sem esforço desde o primeiro gole.", "Entradas, carpaccio, risoto de legumes, carnes brancas"], ["Frutado, redondo", "Úmbria: um Chardonnay com aromas frutados e suculentos e corpo equilibrado. Mostra como a região é versátil também além de seus tintos.", "Peixe, aves, massa com molho de limão"], ["Frutado, estival", "Lombardia, Lago de Garda: um Chiaretto do Valtènesi, com aromas frutados convidativos e acidez fresca. A cor delicada traz clima de verão a qualquer mesa e combina maravilhosamente como aperitivo.", "Antipasti, burrata, saladas, pratos de verão"], ["Encorpado, picante", "Campânia: um Aglianico com fruta escura, estrutura forte e toque picante. O rótulo charmoso com cabra e vila faz dele um vinho sobre o qual se conversa.", "Cozidos, cordeiro, queijos duros fortes"], ["Denso, frutado", "Puglia: um Primitivo com fruta escura densa, toque picante e corpo macio. Um tinto versátil para a mesa animada.", "Pizza, massa com molho de tomate, carnes encorpadas"], ["Caloroso, picante", "Sardenha: a Riserva de Alghero mostra o lado ensolarado da Sardenha: frutas vermelhas maduras, especiarias finas e taninos macios. Um vinho com coração e caráter.", "Cordeiro, caça, carnes grelhadas, pecorino"], ["Denso, elegante", "Toscana: a Argiano une a tradição toscana a uma assinatura moderna. Fruta escura, notas finas de madeira e final sedoso fazem deste corte um vinho para ocasiões especiais.", "Assado de vaca, caça, queijos duros maduros"], ["Vivo, expressivo", "Marche: um tinto das Marche, da Velenosi, com fruta viva e estrutura clara. O rótulo marcante o torna assunto da mesa.", "Massa, pizza, pratos de carne"], ["Encorpado, profundo", "Úmbria: um Montefalco Rosso da Tenuta Castelbuono, com fruta escura, estrutura e profundidade. Um vinho para apreciadores de tintos italianos expressivos.", "Assados, caça, carnes condimentadas"], ["Clássico, harmonioso", "Toscana: o clássico da Antinori reúne a fruta toscana a um equilíbrio harmonioso. Frutas vermelhas, especiarias finas e taninos macios fazem dele um companheiro confiável.", "Bistecca, massa ao ragù, queijos duros, grelhados"], ["Suculento, vivo", "Piemonte: o Bansella da zona de Nizza mostra a Barbera em seu lado elegante: acidez viva, cereja escura e taninos macios. Um vinho que dá vontade de tomar a próxima taça.", "Massa com molho de tomate, aves, salsiccia"], ["Servido em jarra", "Nosso vinho da casa está disponível em branco, tinto e frizzante. O preço é o mesmo para as três opções.", "", "Branco, tinto e frizzante"]], "it": [["", "Perlage fine e fresco, con una delicata dolcezza in chiusura. Un elegante compagno per l'aperitivo o per il dessert.", "", "Sacchetto · Spumante · Extra Dry"], ["Mediterraneo, vivace", "Calabria: un vino bianco calabrese dal frutto mediterraneo e dall'acidità fresca. Rappresenta la sottovalutata varietà della cultura enologica del Sud Italia.", "Pesce, insalate, pasta ai frutti di mare"], ["Minerale, cremoso", "Lombardia, Lago di Garda: il Lugana nasce sulla sponda meridionale del Lago di Garda ed è uno dei bianchi più interessanti del Nord Italia. Delicate note di erbe e frutta a nocciolo, freschezza minerale e una morbidezza cremosa al palato.", "Pesce, frutti di mare, risotto, gnocchi al burro e salvia"], ["Di carattere, gastronomico", "Friuli: un bianco della cantina Marco Felluga, che conquista per espressività e freschezza. L'etichetta con campiture geometriche di colore lo rende anche un richiamo visivo sulla tavola.", "Frutti di mare, verdure grigliate, pasta leggera"], ["Fresco, elegante", "Friuli: un Pinot Grigio del Collio che unisce eleganza e bevibilità. Fini note di pera e agrumi incontrano un'acidità pulita e vivace. Un classico friulano che si beve con facilità fin dal primo bicchiere.", "Antipasti, carpaccio, risotto alle verdure, carni bianche"], ["Fruttato, rotondo", "Umbria: uno Chardonnay dai succosi aromi fruttati e dal corpo equilibrato. Dimostra quanto sia versatile la regione anche al di là dei suoi rossi.", "Pesce, pollame, pasta al limone"], ["Fruttato, estivo", "Lombardia, Lago di Garda: un Chiaretto della Valtènesi, dagli invitanti aromi fruttati e dalla fresca acidità. Il colore delicato porta l'atmosfera estiva su ogni tavola ed è splendido come aperitivo.", "Antipasti, burrata, insalate, piatti estivi"], ["Potente, speziato", "Campania: un Aglianico dal frutto scuro, dalla struttura potente e dalla nota speziata. La simpatica etichetta con capra e borgo ne fa un vino di cui si parla.", "Brasati, agnello, formaggi stagionati intensi"], ["Denso, fruttato", "Puglia: un Primitivo dal frutto scuro denso, dalla nota speziata e dal corpo morbido. Un rosso versatile per la tavola conviviale.", "Pizza, pasta al pomodoro, carni sostanziose"], ["Caldo, speziato", "Sardegna: la Riserva di Alghero mostra il lato solare della Sardegna: frutti rossi maturi, fine speziatura e tannini morbidi. Un vino con cuore e carattere.", "Agnello, selvaggina, carne alla griglia, pecorino"], ["Denso, elegante", "Toscana: Argiano unisce la tradizione toscana a una firma moderna. Frutto scuro, fini note di legno e un finale setoso fanno di questo uvaggio un vino per le occasioni speciali.", "Arrosto di manzo, selvaggina, formaggi stagionati"], ["Vivace, espressivo", "Marche: un rosso marchigiano di Velenosi dal frutto vivace e dalla struttura nitida. La caratteristica etichetta ne fa un argomento di conversazione a tavola.", "Pasta, pizza, piatti di carne"], ["Potente, profondo", "Umbria: un Montefalco Rosso della Tenuta Castelbuono, con frutto scuro, struttura e profondità. Un vino per gli amanti dei rossi italiani espressivi.", "Brasati, selvaggina, carni speziate"], ["Classico, armonioso", "Toscana: il classico Antinori unisce il frutto toscano a un equilibrio armonioso. Frutti rossi, fine speziatura e tannini morbidi ne fanno un compagno affidabile.", "Bistecca, pasta al ragù, formaggi stagionati, grigliate"], ["Succoso, vivace", "Piemonte: il Bansella della zona di Nizza mostra la Barbera nel suo lato elegante: acidità vivace, ciliegia scura e tannini setosi. Un vino che invoglia al calice successivo.", "Pasta al pomodoro, pollame, salsiccia"], ["Sfuso", "Il nostro vino della casa è disponibile bianco, rosso e frizzante. Il prezzo è lo stesso per tutte e tre.", "", "Bianco, rosso e frizzante"]], "en": [["", "Fine bubbles and freshness with a subtle sweetness on the finish. An elegant companion to start the meal or with dessert.", "", "Sacchetto · Sparkling wine · Extra Dry"], ["Mediterranean, lively", "Calabria: a white wine from Calabria with Mediterranean fruit and fresh acidity. It stands for the underrated diversity of southern Italian wine culture.", "Fish, salads, seafood pasta"], ["Mineral, creamy", "Lombardy, Lake Garda: Lugana comes from the southern shore of Lake Garda and is one of northern Italy's most exciting white wines. Delicate notes of herbs and stone fruit, mineral freshness and a creamy texture on the palate.", "Fish, seafood, risotto, gnocchi in sage butter"], ["Characterful, food-friendly", "Friuli: a white wine from the Marco Felluga estate that impresses with expression and freshness. Its label with geometric blocks of colour also makes it a visual highlight on the table.", "Seafood, grilled vegetables, light pasta"], ["Fresh, elegant", "Friuli: a Pinot Grigio from Collio that combines elegance with easy drinking. Fine notes of pear and citrus meet clean, lively acidity. A Friulian classic that goes down effortlessly from the first glass.", "Starters, carpaccio, vegetable risotto, white meat"], ["Fruity, round", "Umbria: a Chardonnay with juicy fruit aromas and a balanced body. It shows how versatile the region is beyond its red specialities.", "Fish, poultry, pasta with lemon sauce"], ["Fruity, summery", "Lombardy, Lake Garda: a Chiaretto from Valtènesi with inviting fruit aromas and fresh acidity. Its delicate colour brings a summer mood to any table and works beautifully as an aperitif.", "Antipasti, burrata, salads, summer dishes"], ["Powerful, spicy", "Campania: an Aglianico with dark fruit, powerful structure and a spicy note. The charming label with a goat and village scene makes it a wine people talk about.", "Braised dishes, lamb, strong hard cheeses"], ["Dense, fruity", "Puglia: a Primitivo with dense dark fruit, a spicy note and a soft body. A versatile red for a convivial table.", "Pizza, pasta with tomato sauce, hearty meat"], ["Warm, spicy", "Sardinia: the Riserva from Alghero shows the sunny side of Sardinia: ripe red berries, fine spice and soft tannins. A wine with heart and character.", "Lamb, game, grilled meat, pecorino"], ["Dense, elegant", "Tuscany: Argiano combines Tuscan tradition with a modern signature. Dark fruit, fine oak notes and a silky finish make this blend a wine for special occasions.", "Roast beef, game, mature hard cheeses"], ["Lively, expressive", "Marche: a red from the Marche region by Velenosi with lively fruit and clear structure. The striking label makes it a talking point at the table.", "Pasta, pizza, meat dishes"], ["Powerful, profound", "Umbria: a Montefalco Rosso from the Tenuta Castelbuono with dark fruit, structure and depth. A wine for lovers of expressive Italian reds.", "Pot roast, game, spiced meat"], ["Classic, harmonious", "Tuscany: the Antinori classic combines Tuscan fruit with harmonious balance. Red fruit, fine spice and soft tannins make it a dependable companion.", "Bistecca, pasta with ragù, hard cheese, grilled dishes"], ["Juicy, lively", "Piedmont: the Bansella from the Nizza zone shows Barbera at its elegant best: lively acidity, dark cherry fruit and supple tannins. A wine that makes you want the next glass.", "Pasta with tomato sauce, poultry, salsiccia"], ["Served by the carafe", "Our house wine comes as white, red and frizzante. The price is the same for all three.", "", "White, red and frizzante"]], "fr": [["", "Bulles fines et fraîcheur, avec une douceur discrète en finale. Un compagnon élégant pour l'apéritif ou le dessert.", "", "Sacchetto · Vin mousseux · Extra Dry"], ["Méditerranéen, vif", "Calabre : un vin blanc de Calabre au fruité méditerranéen et à l'acidité fraîche. Il illustre la diversité sous-estimée de la culture viticole du sud de l'Italie.", "Poisson, salades, pâtes aux fruits de mer"], ["Minéral, crémeux", "Lombardie, lac de Garde : le Lugana provient de la rive sud du lac de Garde et compte parmi les vins blancs les plus passionnants du nord de l'Italie. Notes délicates d'herbes et de fruits à noyau, fraîcheur minérale et onctuosité en bouche.", "Poisson, fruits de mer, risotto, gnocchi au beurre de sauge"], ["Caractère, gastronomique", "Frioul : un vin blanc du domaine Marco Felluga, qui séduit par son expression et sa fraîcheur. Son étiquette aux aplats géométriques de couleur en fait aussi un point de mire sur la table.", "Fruits de mer, légumes grillés, pâtes légères"], ["Frais, élégant", "Frioul : un Pinot Grigio du Collio qui allie élégance et buvabilité. De fines notes de poire et d'agrumes rencontrent une acidité nette et vive. Un classique du Frioul qui se boit sans effort dès le premier verre.", "Entrées, carpaccio, risotto aux légumes, viandes blanches"], ["Fruité, rond", "Ombrie : un Chardonnay aux arômes fruités et juteux, au corps équilibré. Il montre toute la polyvalence de la région, au-delà de ses spécialités rouges.", "Poisson, volaille, pâtes à la sauce citron"], ["Fruité, estival", "Lombardie, lac de Garde : un Chiaretto du Valtènesi, aux arômes fruités engageants et à l'acidité fraîche. Sa robe délicate apporte une ambiance d'été à toute table et il est superbe à l'apéritif.", "Antipasti, burrata, salades, plats d'été"], ["Puissant, épicé", "Campanie : un Aglianico au fruité sombre, à la structure puissante et à la note épicée. L'étiquette charmante avec chèvre et village en fait un vin dont on parle.", "Plats mijotés, agneau, fromages à pâte dure corsés"], ["Dense, fruité", "Pouilles : un Primitivo au fruité sombre dense, à la note épicée et au corps souple. Un rouge polyvalent pour la table conviviale.", "Pizza, pâtes sauce tomate, viandes corsées"], ["Chaleureux, épicé", "Sardaigne : la Riserva d'Alghero montre le côté ensoleillé de la Sardaigne : baies rouges mûres, épices fines et tanins souples. Un vin qui a du cœur et du caractère.", "Agneau, gibier, viandes grillées, pecorino"], ["Dense, élégant", "Toscane : Argiano associe la tradition toscane à une signature moderne. Fruit sombre, fines notes boisées et finale soyeuse font de cet assemblage un vin pour les grandes occasions.", "Rôti de bœuf, gibier, fromages à pâte dure affinés"], ["Vif, expressif", "Marches : un vin rouge des Marches signé Velenosi, au fruit vif et à la structure nette. L'étiquette marquante en fait un sujet de conversation à table.", "Pâtes, pizza, plats de viande"], ["Puissant, profond", "Ombrie : un Montefalco Rosso de la Tenuta Castelbuono, au fruit sombre, à la structure et à la profondeur marquées. Un vin pour les amateurs de rouges italiens expressifs.", "Rôtis braisés, gibier, viandes épicées"], ["Classique, harmonieux", "Toscane : le classique d'Antinori allie fruit toscan et équilibre harmonieux. Fruits rouges, épices fines et tanins souples en font un compagnon fiable.", "Bistecca, pâtes au ragù, fromages à pâte dure, grillades"], ["Juteux, vif", "Piémont : le Bansella de la zone de Nizza montre le Barbera sous son jour élégant : acidité vive, cerise noire et tanins souples. Un vin qui donne envie du verre suivant.", "Pâtes sauce tomate, volaille, salsiccia"], ["Servi en carafe", "Notre vin de la maison existe en blanc, rouge et frizzante. Le prix est le même pour les trois.", "", "Blanc, rouge et frizzante"]]};

const LG=["de","pt","it","en","fr"];
let i=0,dir=1,lang="de";
const $=id=>document.getElementById(id),nav=$("nav"),main=$("main");
function buildNav(){const u=UI[lang];
 nav.innerHTML='<img class="logo" alt="La Piazza Bistro" src="'+LOGO+'">'+Object.keys(C).map(k=>`<button data-c="${k}">${u.cat[k]}</button>`).join("")+'';
 $("lg").innerHTML=LG.map(l=>`<button data-l="${l}" aria-label="${UI[l].name}">${l.toUpperCase()}</button>`).join("")}
document.body.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.c)go(W.findIndex(w=>w.c===b.dataset.c));if(b.dataset.l){lang=b.dataset.l;document.documentElement.lang=lang;buildNav();render(true)}};
function go(n){if(n<0||n>=W.length)return;dir=n>=i?1:-1;i=n;render()}
function render(keep){
 const w=W[i],u=UI[lang],r=lang==="de"?[w.t,w.d,w.m,w.p]:TR[lang][i];
 const lab=x=>x.replace("Glas",u.glass).replace("Flasche",u.bottle);
 main.innerHTML=`<div class="art"><img alt="${w.n}" src="${IMG[w.n]}"></div><div class="txt" style="--dx:${keep?0:dir*24}px"><div class="cat">${u.cat[w.c]}</div><h1>${w.n}</h1><div class="prod">${r[3]||w.p}</div><div class="tags">${r[0]}</div><p class="desc">${r[1]}</p>${r[2]?`<div class="pair"><b>${u.pair}</b>${r[2]}</div>`:''}<div class="price">${w.pr.map(x=>`<div><small>${lab(x[0])}</small><strong>${x[1]}</strong></div>`).join("")}</div></div>`;
 document.querySelectorAll("nav button,#lg button").forEach(b=>b.setAttribute("aria-current",b.dataset.c?b.dataset.c===w.c:b.dataset.l===lang));
 $("info").textContent=u.note;
 $("lg").classList.toggle("off",i!==0);
}
addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(i+1);if(e.key==="ArrowLeft")go(i-1)});
let sx=null;
main.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
main.addEventListener("touchend",e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)go(i+(d<0?1:-1));sx=null});
buildNav();render();
</script>
